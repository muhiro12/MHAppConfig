name: Validate configuration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact policy replacements
        run: bash scripts/validate.sh --base "$BASE_SHA" --candidate "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check validation and recovery behavior
        run: python3 scripts/test_validation.py ".build/validator/$(cat .mhplatform-revision)/mh-validate-remote-config"
